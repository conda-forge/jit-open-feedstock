{% set name = "jit-open" %}
{% set version = "1.0.3" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/jit_open-{{ version }}.tar.gz
  sha256: 9c87da65129a2306c036cb3955edf09c9b5f38157a67ed8836e5a32d07f3b35c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >={{ python_min }}

test:
  imports:
    - jit_open
  commands:
    - pip check
  requires:
    - python {{ python_min }}.*
    - pip

about:
  home: https://github.com/jfjlaros/jit-open
  summary: Just in time open files
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - acaprez
